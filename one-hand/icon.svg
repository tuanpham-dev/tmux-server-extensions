<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#0F766E"/>
  <!-- thumb arc sweeping across a bottom bar -->
  <path d="M20 78 Q64 40 108 78" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <!-- left arrowhead -->
  <path d="M20 78 l14 -8 M20 78 l14 8" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right arrowhead -->
  <path d="M108 78 l-14 -8 M108 78 l-14 8" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- up arrow -->
  <path d="M64 84 L64 44 M64 44 l-9 11 M64 44 l9 11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bottom bar -->
  <rect x="24" y="96" width="80" height="9" rx="4.5" fill="#ffffff" opacity="0.85"/>
</svg>
